spring.application.name=shorturl
# Habilitar la consola web de la base de datos H2
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
# Forzar la ruta exacta
spring.h2.console.path=/h2-console
# La URL para acceder a la base de datos en archivo
spring.datasource.url=jdbc:h2:file:./data/shorturldb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hace que Hibernate cree las tablas automáticamente basándose en nuestro código Java
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola de IntelliJ las consultas SQL reales que se están haciendo
spring.jpa.show-sql=true