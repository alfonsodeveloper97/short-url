<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Enlace no encontrado - 404</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .error-container { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; }
        h1 { color: #e74c3c; font-size: 80px; margin: 0; }
        h2 { color: #333; margin-top: 0; }
        p { color: #666; line-height: 1.5; }
        .btn { display: inline-block; background-color: #4CAF50; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="error-container">
    <h1>404</h1>
    <h2>¡Enlace no encontrado!</h2>
    <p>El código de enlace corto que estás intentando usar no existe en nuestro sistema o ha caducado.</p>
    <a href="http://localhost:8080/" class="btn">Volver al inicio</a>
</div>

</body>
</html>
