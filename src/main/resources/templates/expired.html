<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Enlace Caducado</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; }
        h1 { color: #e67e22; font-size: 70px; margin: 0; }
        h2 { color: #333; margin-top: 10px; }
        p { color: #666; line-height: 1.5; }
        .btn { display: inline-block; background-color: #4CAF50; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>⏳</h1>
    <h2>¡Este enlace ha caducado!</h2>
    <p>El enlace corto al que intentas acceder ha superado su tiempo de vida útil y ya no está disponible.</p>
    <a href="http://localhost:8080/" class="btn">Crear un nuevo enlace</a>
</div>

</body>
</html>
