<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acortador de URLs</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        h1 { color: #333; margin-bottom: 20px; }
        input[type="url"] { width: 80%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; }
        input[type="url"]:focus { border-color: #4CAF50; }
        button { background-color: #4CAF50; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #45a049; }
        .result { margin-top: 25px; padding: 15px; background-color: #e7f3fe; border-left: 6px solid #2196F3; border-radius: 4px; text-align: left; }
        a { color: #2196F3; font-weight: bold; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>✂️ Acortador de URLs</h1>

    <form th:action="@{/acortar-web}" method="POST">
        <input type="url" name="urlLarga" placeholder="Pega tu URL larga aquí (ej: https://google.com)" required>
        <br>
        <button type="submit">Acortar Enlace</button>
    </form>

    <div class="result" th:if="${urlAcortada}">
        <p><strong>¡Listo! Tu URL acortada es:</strong></p>
        <p><a th:href="${urlAcortada}" target="_blank" th:text="${urlAcortada}">http://localhost:8080/xxxxxx</a></p>
    </div>
</div>

</body>
</html>
